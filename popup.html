<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Applied</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hero">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1>Applied</h1>
        <p class="sub">Your application pipeline</p>
      </div>
    </div>

    <div class="tiles">
      <div class="tile t-applied"><span class="num" id="nApplied">0</span><span class="lbl">Applied</span></div>
      <div class="tile t-interviewing"><span class="num" id="nInterviewing">0</span><span class="lbl">Interviews</span></div>
      <div class="tile t-offer"><span class="num" id="nOffer">0</span><span class="lbl">Offers</span></div>
      <div class="tile t-rejected"><span class="num" id="nRejected">0</span><span class="lbl">Rejected</span></div>
    </div>
  </header>

  <div class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search company or role" autocomplete="off">
    </label>
    <nav id="filters" class="seg">
      <button data-f="active" class="on">Active</button>
      <button data-f="viewed">Viewed</button>
      <button data-f="rejected">Rejected</button>
      <button data-f="all">All</button>
    </nav>
  </div>

  <main id="list"></main>

  <div id="toast" class="toast" hidden></div>

  <footer>
    <button id="addPage" class="primary">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      Mark this page as applied
    </button>
    <button id="export" class="ghost" title="Download as a spreadsheet">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      CSV
    </button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
